<!DOCTYPE html>
<!-- Cube Blast App Preview 舞台页（886×1920 = App Store 6.7" 预览片槽位）
     结构照 snake 的同名文件：iframe 装**真的 app**（443×960 ×2 放大），用 window.eval 驱动真实状态，
     外层只叠字幕/进度点/彩纸/结尾卡。
     ⭐ 关键：玩法幕**让游戏自带的教练（Coach.best）自己下棋** —— 盘面是真的在被消掉、
        连击是真的在涨。这不是录屏替身，是产品自带的功能在跑（和 snake 用 AI 代打同一个思路）。
     window.__done=true 时录制结束；window.__sfx 是给 mux 铺音轨的时间戳。 -->
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#2b1160;width:886px;height:1920px;overflow:hidden;
            font-family:'Baloo 2',sans-serif}
  #appwrap{position:absolute;left:0;top:0;width:886px;height:1920px;overflow:hidden}
  #app{width:443px;height:960px;border:0;transform:scale(2);transform-origin:0 0}
  #dots{position:absolute;top:26px;left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:30}
  #dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.24);transition:.3s}
  #dots i.on{background:#ffd84d;transform:scale(1.25)}
  #cover{position:absolute;inset:0;background:#000;z-index:200}
  #cap{position:absolute;left:40px;right:40px;bottom:120px;z-index:40;text-align:center;
       font-size:60px;font-weight:800;color:#fff;line-height:1.28;
       -webkit-text-stroke:3px #2b1160;paint-order:stroke fill;text-shadow:0 6px 24px rgba(20,6,50,.45);
       background:rgba(30,10,66,.42);border-radius:30px;padding:20px 26px;backdrop-filter:blur(4px)}
  #cap .w{display:inline-block;opacity:0;transform:translateY(24px) scale(.8);animation:pop .3s forwards}
  @keyframes pop{to{opacity:1;transform:none}}
  #cap .hl{display:inline-block;padding:2px 20px;border-radius:18px;transform:rotate(-2deg);
           -webkit-text-stroke:0;color:#fff}
  #cap .hl.p{background:#e0508c}#cap .hl.y{background:#f5b800;color:#3a2400}#cap .hl.g{background:#22c55e}
  .cf{position:absolute;width:18px;height:26px;z-index:45;opacity:0}
  @keyframes cfall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rr))}}
  #stick{position:absolute;top:31%;left:50%;transform:translateX(-50%) scale(0);z-index:46;
         background:#22c55e;color:#fff;font-size:62px;font-weight:800;padding:14px 46px;border-radius:999px;
         box-shadow:0 12px 40px rgba(34,197,94,.45)}
  #stick.show{animation:stick .5s forwards}
  @keyframes stick{0%{transform:translateX(-50%) scale(0) rotate(-12deg)}
                   70%{transform:translateX(-50%) scale(1.15) rotate(3deg)}
                   100%{transform:translateX(-50%) scale(1) rotate(-2deg)}}
  #end{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
       flex-direction:column;gap:34px;background:rgba(43,17,96,.72);backdrop-filter:blur(6px)}
  #end img{width:320px;height:320px;border-radius:72px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(0)}
  #end.show{display:flex}
  #end.show img{animation:stick .6s forwards}
  #end .star{position:absolute;font-size:60px;opacity:0;animation:pop .4s forwards}
  #endcap{font-size:72px;font-weight:800;color:#fff;-webkit-text-stroke:3px #2b1160;paint-order:stroke fill;
          text-align:center;line-height:1.2}
  #endsub{font-size:42px;font-weight:800;color:#3a2400;background:#ffd84d;padding:12px 44px;border-radius:999px;
          box-shadow:0 10px 34px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="appwrap"><iframe id="app" src="/games/blockblast/index.html"></iframe></div>
<div id="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div id="cap"></div>
<div id="stick">PERFECT!</div>
<div id="end">
  <img src="/games/blockblast/assets/icons/icon-512.png">
  <div id="endcap">Cube Blast</div>
  <div id="endsub">Free · Offline · No tricks</div>
</div>
<div id="cover"></div>
<script>
const $ = s => document.querySelector(s);
const ifr = $('#app');
const E = code => ifr.contentWindow.eval(code);
let t0 = 0;
window.__sfx = []; window.__caps = []; window.__done = false;
const sfx = (t, type, vol) => window.__sfx.push({ t, type, vol });

function cap(html) {
  const el = $('#cap');
  if (!html) { el.innerHTML = ''; return; }
  // ⚠ 高亮块可以含空格（{g:it is yours}）⇒ **先整体切出高亮段**再逐词包 .w
  const parts = html.split(/(\{[gyp]:[^}]+\})/).filter(Boolean);
  let wi = 0, out = '';
  for (const part of parts) {
    const m = part.match(/^\{(g|y|p):([^}]+)\}$/);
    if (m) {
      out += '<span class="w" style="animation-delay:' + (wi++) * 0.09 + 's">'
           + '<span class="hl ' + m[1] + '">' + m[2] + '</span></span> ';
    } else {
      out += part.trim().split(/\s+/).filter(Boolean)
        .map(w => '<span class="w" style="animation-delay:' + (wi++) * 0.09 + 's">' + w + '</span>')
        .join(' ') + ' ';
    }
  }
  el.innerHTML = out;
  window.__caps.push({ t: (performance.now() - t0) / 1000, text: html.replace(/\{(g|y|p):(.+?)\}/g, '$2') });
}
const dot = n => document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i <= n));
function confetti() {
  const colors = ['#ffd84d', '#22c55e', '#e0508c', '#60a5fa', '#c084fc'];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement('div'); c.className = 'cf';
    c.style.background = colors[i % 5];
    c.style.left = (360 + Math.random() * 160) + 'px'; c.style.top = '620px';
    c.style.setProperty('--dx', (Math.random() * 700 - 350) + 'px');
    c.style.setProperty('--dy', (420 + Math.random() * 520) + 'px');
    c.style.setProperty('--rr', (Math.random() * 720 - 360) + 'deg');
    c.style.animation = `cfall ${0.9 + Math.random() * 0.5}s ease-out forwards`;
    document.body.appendChild(c);
  }
}

// ===== 时间轴（总长 ~24s；App Store 预览片要求 15–30s）=====
const T = [
  // S1 0–6 真实玩法：教练自己下棋，行一条条被消掉
  [0.0, () => { dot(0); cap('The pieces are decided {p:before you start}'); }],
  [1.2, () => sfx(1.2, 'place', 0.9)],
  [2.0, () => { sfx(2.0, 'clear-s5'); }],
  [3.2, () => sfx(3.2, 'place', 0.9)],
  [4.2, () => { cap('Chase the streak — {y:that is the score}'); sfx(4.3, 'clear-s8-L3'); }],
  [5.4, () => sfx(5.4, 'sweep')],

  // S2 6–10.5 公平页：种子 + 权重表（这是本作唯一的、也是最强的差异化）
  [6.0, () => {
    dot(1); stopAuto();
    E(`G.phase='FAIR';renderAll();`);
    cap('Copy the seed. {g:Same pieces, every time.}'); sfx(6.05, 'collect');
  }],
  [8.6, () => { cap('Dealing never looks at {p:your board}'); }],

  // S3 10.5–14 300 关
  [10.5, () => {
    dot(2);
    E(`G.phase='MENU';G.chapter=2;renderAll();`);
    cap('{y:300 levels} across 30 chapters'); sfx(10.55, 'levelUp');
  }],

  // S4 14–17.6 教练：最优落点高亮
  [14.0, () => {
    dot(3);
    E(`(function(){G.phase='PLAYING';var m=Coach.best(G.s);
        if(m)G.coachHint={slot:m.slot,r:m.r,c:m.c};G.animClock=Math.PI/8;renderAll();})()`);
    cap('A coach shows the {g:best move}'); sfx(14.05, 'brilliant');
  }],
  [16.0, () => { cap('and which move {p:cost you the run}'); }],

  // S5 17.6–21 收集：500 张画像
  [17.6, () => {
    dot(4);
    E(`G.phase='ANG';G.angPage=0;renderAll();`);
    cap('{y:500} angels to collect'); sfx(17.65, 'coin');
  }],
  [19.6, () => { confetti(); $('#stick').classList.add('show'); sfx(19.65, 'sweep-perfect'); }],

  // S6 21–24 结尾卡
  [20.9, () => {
    dot(5); $('#stick').classList.remove('show');
    $('#end').classList.add('show'); cap(''); sfx(21.0, 'levelUp');
    [[170, 430], [660, 390], [230, 1300], [640, 1350], [430, 250]].forEach(([x, y], i) => {
      const s = document.createElement('div'); s.className = 'star'; s.textContent = '✨';
      s.style.cssText = `left:${x}px;top:${y}px;animation-delay:${0.15 * i}s`;
      $('#end').appendChild(s);
    });
  }],
  [24.0, () => { window.__done = true; }],
];

function stopAuto() { E(`if(window.__auto){clearInterval(window.__auto);window.__auto=null;}`); }

/** app 预置：造一份「玩了很久」的存档 + 让**教练自己下棋** + 藏掉网页味的控件 */
function prep() {
  E(`
    (function(){
      for (var i=1;i<=64;i++) G.progress[i] = [3,2,3,1,3,2,3,3,1,2][i%10] || 2;
      G.wallet.coins = 1240; G.wallet.angels = 137; G.wallet.gamesPlayed = 46;
      G.wallet.themes = ['neon']; G.wallet.chests = [1,2]; G.best = 8420;
      G.profile.dailyStreak = 12; G.profile.brilliants = 37; G.profile.stars = 140;
      G.profile.levelsWon = 64; G.profile.turns = 2400; G.profile.lines = 610;
      // ⛔ 片子里不要出现「看广告」按钮：把当天额度摆成用完 ⇒ 那几个位自动变灰退到背景
      var used = { day: Shop.ymd(Date.now()) };
      Object.keys(Shop.AD_CAPS).forEach(function(k){ used[k] = 99; });
      G.wallet.ads = used;
      // ⚠ 引擎的 DOM 控制栏（语言下拉）是网页版的味道 —— 整幕禁掉
      var st = document.createElement('style');
      st.textContent = '#controls{display:none!important}';
      document.head.appendChild(st);

      dispatch('NEW_RUN');
      G.phase = 'PLAYING';
      G.items.undoFree = 1; G.items.refreshCharge = 2; G.items.hintFree = 1;
      // ⭐ 让**游戏自带的教练**自己下棋：盘面真的在被消掉，不是手工摆的假画面。
      //    死了就开新局，保证前 6 秒一直有动作。
      window.__auto = setInterval(function(){
        try {
          if (!G.s || G.s.over) { dispatch('NEW_RUN'); G.phase='PLAYING'; return; }
          var m = Coach.best(G.s);
          if (!m) { dispatch('NEW_RUN'); G.phase='PLAYING'; return; }
          onPlace(m.slot, m.r, m.c);
        } catch(e) {}
      }, 620);
    })()
  `);
}
function play() {
  prep();
  setTimeout(() => {
    t0 = performance.now();
    T.forEach(([s, fn]) => { if (s === 0) fn(); else setTimeout(fn, s * 1000); });
    $('#cover').remove();
  }, 700);
}
window.addEventListener('load', () => {
  ifr.addEventListener('load', () => setTimeout(play, 1600));
  if (ifr.contentDocument && ifr.contentDocument.readyState === 'complete') setTimeout(play, 1600);
});
</script>
</body>
</html>
