<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Angel Snake</title>
<link rel="stylesheet" href="../../engine/engine.css?v=25">
<link rel="stylesheet" href="css/game.css?v=25">
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="controls"></div>
<div id="home" class="hidden"></div>
<div id="toasts"></div>
<div id="panel" class="hidden">
  <div id="panel-card">
    <div id="panel-head"><span id="panel-title"></span><button id="panel-close" type="button">✕</button></div>
    <div id="panel-tabs"></div>
    <div id="panel-body"></div>
  </div>
</div>
<div id="lightbox" class="hidden"></div>

<script>
  window.GAME_CONFIG = {
    id: 'snake',
    // ⭐ 分享出去的链接一律指向 **App Store**，不是网页版（engine/share.js）——
    //    网页版不产生下载量/评分/排名，把朋友导过去等于白送掉一次转化。
    //    ⚠ 没上架的游戏别填这一项，share.js 会自动回退到 webUrl（分享个 404 比网页版更差）。
    appStoreId: '6789757716',
    webUrl: 'https://snake.ai-speeds.com/',
    // 10 大语言(按母语人数,引擎默认集)。加语言=加 locales/<code>.json,零改逻辑。
    languages: ['zh-CN', 'en', 'es', 'hi', 'bn', 'pt-BR', 'ru', 'ja', 'pa', 'de'],
    // Angel Snake 专属 AdMob 广告位(iOS;Android 上架时再补)——绝不复用他游戏 ID。
    // 引擎按「该平台有真值即关测试模式」自动切换;web 端不走这里(confirm 模拟)。
    adUnits: {
      rewarded:     { ios: 'ca-app-pub-2141208066469648/4457804077' },
      interstitial: { ios: 'ca-app-pub-2141208066469648/5188431812' },
    },
    sfx: {
      eat: 'assets/audio/eat.wav', special: 'assets/audio/special.wav',
      shield: 'assets/audio/shield.wav', milestone: 'assets/audio/milestone.wav',
      level: 'assets/audio/level.wav', death: 'assets/audio/death.wav',
    },
  };
</script>
<script src="../../engine/config.js?v=25"></script>
<script src="../../engine/ui-icons.js?v=25"></script>

<script src="../../engine/canvas.js?v=25"></script>
<script src="../../engine/input.js?v=25"></script>
<script src="../../engine/controls.js?v=25"></script>
<script src="../../engine/prng.js?v=25"></script>
<script src="js/fruits.js?v=25"></script>
<script src="js/core.js?v=25"></script>
<script src="js/ai.js?v=25"></script>
<script src="js/storage.js?v=25"></script>
<script src="js/achievements.js?v=25"></script>
<script src="js/themes.js?v=25"></script>
<script src="js/gallery.js?v=25"></script>
<script src="js/quests.js?v=25"></script>
<script src="js/meta.js?v=25"></script>
<script src="js/adgate.js?v=25"></script>

</body>
</html>
